<div class="tutorial-page">
  <div class="tutorial-container">
    <div class="lesson-workspace">
      <app-sidebar
        (lessonCodeChange)="onLessonChange($event)"
        [currentLessonCode]="selectedLessonCode"
        class="tutorial-sidebar"/>

      <div class="lesson-content-wrapper">
        <lesson-content
          [code]="selectedLessonCode"
          (nextLesson)="navigateToNext()"
          (previousLesson)="navigateToPrevious()"/>
      </div>
    </div>
  </div>
</div>
